# כל מה שנכנס ל-main (merge של pull request או push) נבנה, נבדק ועולה לאתר החי: gabayteam.co.il.
# הפעולה פורסת רק את Hosting, לא את dataconnect ולא את Firestore.
# המפתח (secret) נוצר עם: firebase init hosting:github
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    # שינויים שלא משפיעים על האתר עצמו
    paths-ignore:
      - "bot/**"
      - "**/*.md"

# שתי פריסות לא רצות במקביל; השנייה מחכה לראשונה
concurrency:
  group: live-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GABAYTEAM_6D556 }}
          channelId: live
          projectId: gabayteam-6d556
