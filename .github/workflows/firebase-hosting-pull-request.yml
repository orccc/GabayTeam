# כל pull request נבנה, נבדק (npm run check) ועולה לכתובת preview זמנית.
# Firebase מוסיף את הכתובת כתגובה על ה-pull request. האתר החי לא משתנה.
# המפתח (secret) נוצר עם: firebase init hosting:github
name: Preview on pull request

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    # pull requests מ-fork לא מקבלים את המפתח
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GABAYTEAM_6D556 }}
          projectId: gabayteam-6d556
          expires: 7d
